<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='%23ffc46b'/%3E%3C/svg%3E"
    />
    <title>忘忧居 · 后台</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <div id="login-view" class="login-wrap" hidden>
      <form id="login-form" class="login" autocomplete="on">
        <div class="brand"><b>忘忧居</b><span>Admin</span></div>
        <p class="hint">内容管理后台 · 只有你和这台机器知道口令</p>
        <label class="field">
          <span>用户名</span>
          <input type="text" id="login-user" value="admin" autocomplete="username" required />
        </label>
        <label class="field">
          <span>口令</span>
          <input type="password" id="login-pass" autocomplete="current-password" required />
        </label>
        <div class="form-actions">
          <button class="btn primary" type="submit" style="width: 100%; justify-content: center">进去</button>
        </div>
      </form>
    </div>

    <div id="app" class="shell" hidden>
      <aside class="side">
        <div class="brand"><b>忘忧居</b><span>内容管理</span></div>
        <nav id="nav"></nav>
        <div class="foot">
          <a class="btn sm ghost" id="site-link" target="_blank" rel="noopener">站点 ↗</a>
          <a class="btn sm ghost" href="/docs" target="_blank" rel="noopener">接口 →</a>
          <button class="btn sm ghost" id="logout">退出</button>
        </div>
      </aside>
      <main class="main">
        <div class="topbar">
          <h1 id="view-title">概览</h1>
          <div class="tools">
            <span class="pill" id="build-pill"><i></i><span>未构建</span></span>
            <button class="btn primary" id="publish-btn">保存并发布</button>
          </div>
        </div>
        <section id="view"></section>
      </main>
    </div>

    <div class="toast" id="toast"></div>
    <!-- Markdown 渲染器放本地：后台不联网也能预览，marked 是 MIT -->
    <script src="/admin/vendor/marked.min.js"></script>
    <script src="/admin/admin.js"></script>
  </body>
</html>
