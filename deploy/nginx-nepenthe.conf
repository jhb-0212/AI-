# Nepenthe 站点 + 后台的 nginx 配置。用法见同目录 README.md。
# 放在 /etc/nginx/conf.d/nepenthe.conf（Debian/Ubuntu 默认在 http{} 里 include 这个目录，
# 所以下面 limit_req_zone 这类只能写在 http 层的指令才有位置放）。
# 改完：sudo nginx -t && sudo systemctl reload nginx

# ---------- 限流分区 ----------

# 埋点接口：一个 IP 每秒 2 条足够（正常访客一页只发一条）
limit_req_zone $binary_remote_addr zone=hit:10m rate=2r/s;
# 后台 / 普通接口：宽松些，但挡住脚本狂刷
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
# 单 IP 并发连接数，挡「一次开几百个请求」
limit_conn_zone $binary_remote_addr zone=conn:10m;

# ---------- 如果前面挂了 Cloudflare / 其它 CDN ----------
# 不配这一段，所有访客的 IP 都会变成 CDN 节点的 IP：
# UV 会塌成 1、限流会把所有人当成同一个人误伤。
# 两个来源都要：CF 的 IPv4/IPv6 段（https://www.cloudflare.com/ips/ 会更新，别抄死）。
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 2400:cb00::/32;
# real_ip_header CF-Connecting-IP;

# ---------- 80 跳 HTTPS ----------

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- 主站 ----------

server {
    # listen 里的 http2 参数在 nginx 1.25.1+ 会提示 deprecated 但仍可用；
    # 只有你确认服务器是 1.25.1 以上，才改成 `listen 443 ssl;` + 单独一行 `http2 on;`
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name blog.example.com;

    ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 静态产物（npm run build 出来的 dist）
    root  /srv/nepenthe/dist;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 反代通用头（下面每个 location 都继承这一组）
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # 单 IP 并发上限
    limit_conn conn 20;

    # 构建产物文件名带 hash，可以放心长缓存
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 照片：后台挂载在 /gallery（上传的图直接进 public/gallery，构建后也在 dist 里）
    location /gallery/ {
        try_files $uri @gallery_api;
    }

    location @gallery_api {
        proxy_pass http://127.0.0.1:8100;
    }

    # 前台页面
    location / {
        try_files $uri $uri/ =404;
    }

    # 自定义 404：状态码保持 404（try_files 回落成 200 会把 SEO 弄乱）
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 埋点：只收 POST、body 只允许 1k、每 IP 2 次/秒、不写访问日志
    location = /api/hit {
        limit_req  zone=hit burst=10 nodelay;
        limit_except POST { deny all; }
        client_max_body_size 1k;
        access_log off;
        proxy_pass http://127.0.0.1:8100;
    }

    # 其它接口（含登录、发布、上传）
    location /api/ {
        limit_req  zone=api burst=40 nodelay;
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8100;
    }

    # 后台界面
    location = /admin { return 301 /admin/; }

    location /admin/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8100;
    }

    # 顺手挡一下扫目录 / 扫 .env 的脚本
    location ~ /\. {
        deny all;
    }
}
